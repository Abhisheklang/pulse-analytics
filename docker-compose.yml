# Pulse Analytics with Docker Compose.
#
# Starts two services: the Pulse application and a PostgreSQL database.
# Copy .env.docker.example to .env and change the password and APP_SECRET
# before using this anywhere beyond a local test.
#
# The default values below (user pulse, password pulse, database pulse)
# are local development defaults only. Change them in your .env file.

services:
  app:
    build: .
    image: ghcr.io/abhisheklang/pulse-analytics:latest
    ports:
      - "3000:3000"
    environment:
      # Inside Compose, the database host is the service name "db".
      # If you set DATABASE_URL in .env, keep the host as "db" unless the
      # database runs outside this Compose stack.
      DATABASE_URL: ${DATABASE_URL:-postgresql://pulse:pulse@db:5432/pulse}
      APP_SECRET: ${APP_SECRET:-change-me-generate-a-real-secret}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # PostgreSQL 16 matches the version used in CI. Pulse requires
    # PostgreSQL v12.14 or later.
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    volumes:
      - pulse-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse} -d ${POSTGRES_DB:-pulse}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pulse-db:
